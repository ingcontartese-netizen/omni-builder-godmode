<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" role="img" aria-label="Omni-Builder GodMode - governed agent skill">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1020"/>
      <stop offset="55%" stop-color="#101a33"/>
      <stop offset="100%" stop-color="#0d2438"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4ea8ff"/>
      <stop offset="50%" stop-color="#7ee0c3"/>
      <stop offset="100%" stop-color="#4ea8ff"/>
    </linearGradient>
  </defs>
  <style>
    .title { font: 700 52px 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; fill: #f2f6ff; }
    .sub   { font: 400 22px 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; fill: #9fb4d8; }
    .inv   { font: 600 20px 'Cascadia Code', 'Fira Code', Consolas, monospace; fill: #7ee0c3; }
    .neq   { fill: #ff9d5c; }
    .fade1 { opacity: 0; animation: rise 0.9s ease-out 0.15s forwards; }
    .fade2 { opacity: 0; animation: rise 0.9s ease-out 0.55s forwards; }
    .fade3 { opacity: 0; animation: rise 0.9s ease-out 1.0s forwards; }
    .bar   { transform-box: fill-box; transform-origin: left center; transform: scaleX(0);
             animation: grow 1.1s cubic-bezier(.2,.8,.2,1) 1.3s forwards; }
    .pulse { animation: glow 3.2s ease-in-out 2.4s infinite; }
    @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes grow { to { transform: scaleX(1); } }
    @keyframes glow { 0%,100% { opacity: 1; } 50% { opacity: 0.55; } }
  </style>
  <rect width="1200" height="300" fill="url(#bg)"/>
  <text x="80" y="112" class="title fade1">Omni-Builder <tspan fill="url(#accent)">GodMode</tspan></text>
  <text x="80" y="156" class="sub fade2">Build <tspan fill="#f2f6ff" font-weight="600">anything</tspan> — with infinite memory on disk and a two-brain team that proves every claim.</text>
  <rect x="80" y="182" width="640" height="3" rx="1.5" fill="url(#accent)" class="bar"/>
  <text x="80" y="232" class="inv fade3 pulse">KNOWLEDGE_AVAILABLE <tspan class="neq">&#8800;</tspan> SKILL_INVOKED <tspan class="neq">&#8800;</tspan> EFFECT_AUTHORIZED</text>
  <text x="80" y="268" class="sub fade3" font-size="17">Never auto-invokes &#183; typed consent gates &#183; every green claim reproducible</text>
</svg>
